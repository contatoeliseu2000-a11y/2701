<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayane 💙</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
overflow:hidden;
background:black;
color:white;
text-align:center;
}

/* ===== TELA INICIAL ===== */

.intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
transition:1.5s;
}

.intro h1{
font-size:32px;
margin-bottom:20px;
letter-spacing:2px;
animation:fadeIn 3s ease-in-out;
}

.intro p{
opacity:0.7;
margin-bottom:30px;
}

.intro button{
padding:15px 35px;
border:none;
border-radius:30px;
background:#00aaff;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.intro button:hover{
background:#0088cc;
transform:scale(1.05);
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

/* ===== VIDEO FUNDO ===== */

video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
opacity:0;
transition:2s;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:-1;
opacity:0;
transition:2s;
}

/* ===== CONTEÚDO PRINCIPAL ===== */

.container{
position:relative;
top:50%;
transform:translateY(-50%);
padding:20px;
max-width:900px;
margin:auto;
opacity:0;
transition:2s;
}

h1{
font-size:36px;
margin-bottom:40px;
letter-spacing:2px;
}

.heart{
color:#00ccff;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

button.music{
padding:18px 40px;
border:none;
border-radius:40px;
background:#00aaff;
color:white;
font-size:18px;
cursor:pointer;
margin:15px;
transition:0.3s;
min-width:280px;
}

button.music:hover{
background:#0088cc;
transform:scale(1.08);
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
<h1>Existe algo especial aqui...</h1>
<p>Pressione entrar e descubra 💙</p>
<button onclick="entrar()">Entrar</button>
</div>

<!-- VIDEO -->
<video id="bgVideo" autoplay muted loop>
<source src="video/universo.mp4" type="video/mp4">
</video>

<div class="overlay" id="overlay"></div>

<!-- CONTEÚDO -->
<div class="container" id="conteudo">
<h1>Para Kayane <span class="heart">💙</span></h1>

<button class="music" onclick="tocar('musicas/seu-nome-e-paz.mp3')">
🎵 Seu Nome é Paz
</button><br>

<button class="music" onclick="tocar('musicas/meu-coracao-e-seu.mp3')">
🎵 Meu Coração é Seu
</button><br>

<button class="music" onclick="tocar('musicas/paz-em-voce.mp3')">
🎵 Paz em Você
</button>

<audio id="player"></audio>
</div>

<script>

const intro = document.getElementById("intro");
const video = document.getElementById("bgVideo");
const overlay = document.getElementById("overlay");
const conteudo = document.getElementById("conteudo");
const player = document.getElementById("player");

function entrar(){
intro.style.opacity="0";
setTimeout(()=>{
intro.style.display="none";
video.style.opacity="1";
overlay.style.opacity="1";
conteudo.style.opacity="1";
},1000);
}

function tocar(arquivo){
player.pause();
player.currentTime=0;
player.src=arquivo;
player.play();
}

</script>

</body>
</html>
