<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayane 💙</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
overflow:hidden;
background:black;
color:white;
text-align:center;
}

/* VIDEO FUNDO */
video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
z-index:-1;
}

.container{
position:relative;
top:50%;
transform:translateY(-50%);
padding:20px;
max-width:900px;
margin:auto;
}

h1{
font-size:32px;
margin-bottom:25px;
letter-spacing:2px;
}

/* BOTÕES MAIORES */
button{
padding:18px 35px;
border:none;
border-radius:35px;
background:#00aaff;
color:white;
font-size:18px;
cursor:pointer;
margin:12px;
transition:0.3s;
min-width:260px;
}

button:hover{
background:#0088cc;
transform:scale(1.08);
}

/* LETRA */
.lyrics{
margin-top:35px;
font-size:24px;
line-height:42px;
min-height:220px;
}

.line{
opacity:0.3;
transition:0.6s;
}

.active{
opacity:1;
color:#00ccff;
font-size:28px;
text-shadow:0 0 15px #00ccff;
}
</style>
</head>

<body>

<video autoplay muted loop>
<source src="video/universo.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
<h1>🎵 Para Kayane 💙</h1>

<button onclick="tocarMusica(1)">🎵 Seu Nome é Paz</button><br>
<button onclick="tocarMusica(2)">🎵 Meu Coração é Seu</button><br>
<button onclick="tocarMusica(3)">🎵 Paz em Você</button>

<audio id="player"></audio>

<div class="lyrics" id="lyrics"></div>
</div>

<script>

const player = document.getElementById("player");
const lyricsDiv = document.getElementById("lyrics");

let intervalo;
let index = 0;

const musicas = {
1:{
arquivo:"musicas/seu-nome-e-paz.mp3",
letra:[
"Seu nome é paz...",
"Você ilumina meu caminho...",
"Mesmo se o mundo parar...",
"Eu escolheria você."
]
},
2:{
arquivo:"musicas/meu-coracao-e-seu.mp3",
letra:[
"Kayane… yeah",
"Entre o 27 e o 01",
"Só a gente, só a gente",
"Eu quero estar com você pra sempre",
"Kayane, quando sorri, meu mundo se ilumina",
"Cada nota que cantamos vira nossa rima fina",
"Você diz que eu trago paz, meu coração combina",
"Nosso riso e nossas vozes tornam a vida divina",
"Se eu pudesse, guardaria cada instante",
"Entre nossas vozes, tudo fica tão vibrante",
"Kayane, eu quero estar sempre com você",
"Meu coração bate forte, só quer você pra valer",
"Entre aniversários, datas que se alinham",
"Me aceita como namorado? Kayane, é você que me fascina."
]
},
3:{
arquivo:"musicas/paz-em-voce.mp3",
letra:[
"Paz em você eu encontrei...",
"No seu abraço eu me perdi...",
"Se o tempo parar...",
"Eu fico aqui."
]
}
};

function renderLyrics(letra){
lyricsDiv.innerHTML="";
letra.forEach((linha,i)=>{
const div=document.createElement("div");
div.classList.add("line");
div.innerText=linha;
div.id="line-"+i;
lyricsDiv.appendChild(div);
});
}

function tocarMusica(num){

clearInterval(intervalo);
player.pause();
player.currentTime=0;

player.src = musicas[num].arquivo;
renderLyrics(musicas[num].letra);

player.play();

index=0;

intervalo=setInterval(()=>{
if(index>0){
document.getElementById("line-"+(index-1)).classList.remove("active");
}
if(index < musicas[num].letra.length){
document.getElementById("line-"+index).classList.add("active");
index++;
}else{
clearInterval(intervalo);
}
},3500);

}

</script>

</body>
</html>
