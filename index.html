<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayane 💙</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

/* VIDEO FUNDO */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* ESCURECER FUNDO */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,30,0.6);
  z-index: -1;
}

/* CONTEUDO */
.container {
  padding: 30px 15px;
}

/* CORAÇÃO */
.heart {
  font-size: 40px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% {transform: scale(1);}
  50% {transform: scale(1.2);}
  100% {transform: scale(1);}
}

/* IMAGEM */
img {
  width: 90%;
  max-width: 350px;
  border-radius: 20px;
  margin: 20px 0;
}

/* MUSICAS */
.card {
  background: rgba(0,0,0,0.5);
  padding: 15px;
  margin: 20px auto;
  width: 90%;
  max-width: 450px;
  border-radius: 15px;
}

audio {
  width: 100%;
}

.frase {
  margin-top: 40px;
  font-size: 18px;
}

</style>
</head>

<body>

<video autoplay muted loop>
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

<h1>Kayane 💙</h1>
<p>Esse site é só pra você.</p>

<div class="heart">💙</div>

<p>Já se passaram 370 dias desde que algo especial começou.</p>

<img src="foto.jpg">

<div class="card">
  <p>Seu Nome é Paz</p>
  <audio controls>
    <source src="musicas/seu-nome-e-paz.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="card">
  <p>Meu Coração é Seu</p>
  <audio controls>
    <source src="musicas/meu-coracao-e-seu.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="card">
  <p>Paz em Você</p>
  <audio controls>
    <source src="musicas/paz-em-voce.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="frase">
Entre o tempo e o espaço…  
eu escolheria você em qualquer universo. 🌌
</div>

</div>

</body>
</html>
