<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayane 💙</title>

<style>

/* CONFIGURAÇÃO BASE */
body {
margin:0;
padding:0;
font-family:Arial, sans-serif;
color:white;
text-align:center;
overflow-x:hidden;
}

/* VIDEO FUNDO */
#bg-video{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
z-index:-2;
}

/* CAMADA ESCURA */

.overlay{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:rgba(0,0,30,0.65);
z-index:-1;
}

/* TELA ENTRADA */

#entrada{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.6);
z-index:5;
}

#entrada h1{
font-size:40px;
}

#entrada p{
font-size:18px;
opacity:0.9;
}

#entrada button{
margin-top:25px;
padding:15px 40px;
font-size:18px;
border:none;
border-radius:12px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

/* CONTEÚDO */

.container{
padding:40px 20px;
position:relative;
z-index:1;
display:none;
}

/* CORAÇÃO */

.heart{
font-size:40px;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

/* FOTO PRINCIPAL */

img{
width:90%;
max-width:350px;
border-radius:20px;
margin:20px 0;
}

/* PLAYER MODERNO */

.music-player{
display:flex;
align-items:center;
gap:15px;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(10px);
padding:15px;
margin:25px auto;
width:90%;
max-width:500px;
border-radius:18px;
box-shadow:0 0 20px rgba(255,80,120,0.3);
}

.music-player img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
margin:0;
}

.music-info{
flex:1;
text-align:left;
}

.music-info h3{
margin:0;
font-size:16px;
}

.music-info p{
margin:0;
font-size:13px;
opacity:0.7;
}

audio{
width:100%;
margin-top:8px;
}

.frase{
margin-top:40px;
font-size:18px;
}

/* ESTRELA CADENTE */

.shooting-star{
position:fixed;
top:0;
left:-100px;
width:3px;
height:3px;
background:white;
box-shadow:0 0 10px white;
animation:shoot 6s linear infinite;
}

@keyframes shoot{
0%{transform:translate(0,0);opacity:0;}
10%{opacity:1;}
100%{transform:translate(120vw,60vh);opacity:0;}
}

</style>
</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
<source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="shooting-star"></div>

<div id="entrada">

<h1>Kayane 🌹</h1>

<p>No dia 27 de novembro…</p>
<p>nasceu alguém especial.</p>

<button onclick="entrar()">Entrar</button>

</div>

<div class="container" id="site">

<h1>🥰 Kayane 💙</h1>

<p>Esse site é só pra você.</p>

<div class="heart">💙</div>

<p>Você merece o mundo.</p>

<img src="foto.jpg">

<h2>🎵 Suas músicas</h2>

<div class="music-player">

<img src="foto.jpg">

<div class="music-info">

<h3>Seu Nome é Paz</h3>
<p>Kayane</p>

<audio controls>
<source src="musicas/seu-nome-e-paz.mp3" type="audio/mpeg">
</audio>

</div>

</div>

<div class="music-player">

<img src="foto.jpg">

<div class="music-info">

<h3>Meu Coração é Seu</h3>
<p>Kayane</p>

<audio controls>
<source src="musicas/meu-coracao-e-seu.mp3" type="audio/mpeg">
</audio>

</div>

</div>

<div class="music-player">

<img src="foto.jpg">

<div class="music-info">

<h3>Paz em Você</h3>
<p>Kayane</p>

<audio controls>
<source src="musicas/paz-em-voce.mp3" type="audio/mpeg">
</audio>

</div>

</div>

<div class="frase">
Entre o tempo e o espaço…  
eu escolheria você em qualquer universo. 🌌
</div>

</div>

<script>

function entrar(){
document.getElementById("entrada").style.display="none";
document.getElementById("site").style.display="block";
}

</script>

</body>
</html>
