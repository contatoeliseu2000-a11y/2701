<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayane 💙</title>

<style>

/* CONFIGURAÇÃO BASE */
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* VIDEO TELA CHEIA (SEM PULSAR) */
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: -2;
  transform: none !important;
}

/* CAMADA ESCURA */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 30, 0.65);
  z-index: -1;
}

/* CONTEÚDO */
.container {
  padding: 40px 20px;
  position: relative;
  z-index: 1;
}

/* CORAÇÃO (SÓ ELE PULSA) */
.heart {
  font-size: 40px;
  display: inline-block;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* IMAGEM */
img {
  width: 90%;
  max-width: 350px;
  border-radius: 20px;
  margin: 20px 0;
}

/* CARDS DAS MÚSICAS */
.card {
  background: rgba(0,0,0,0.5);
  padding: 15px;
  margin: 20px auto;
  width: 90%;
  max-width: 450px;
  border-radius: 15px;
}

audio {
  width: 100%;
}

.frase {
  margin-top: 40px;
  font-size: 18px;
}

</style>
</head>

<body>

<!-- VIDEO FUNDO -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

<h1>🥰 Kayane 💙</h1>
<p>Esse site é só pra você.</p>

<div class="heart">💙</div>

<p> você mereçe o mundo.</p>

<img src="foto.jpg">

<h2>🎵 Suas músicas</h2>

<div class="card">
  <p>Seu Nome é Paz</p>
  <audio controls>
    <source src="musicas/seu-nome-e-paz.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="card">
  <p>Meu Coração é Seu</p>
  <audio controls>
    <source src="musicas/meu-coracao-e-seu.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="card">
  <p>Paz em Você</p>
  <audio controls>
    <source src="musicas/paz-em-voce.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="frase">
Entre o tempo e o espaço…  
eu escolheria você em qualquer universo. 🌌
</div>

</div>

</body>
</html>
